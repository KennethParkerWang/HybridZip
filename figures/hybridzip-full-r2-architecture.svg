  <path d="M1180 300 V350 H825 V425" class="edge-planned"/>
  <path d="M120 550 V760" class="edge-current"/>
  <path d="M825 575 V760" class="edge-current"/>
  <path d="M1118 565 V760" class="edge-planned"/>
  <path d="M1385 565 V760" class="edge-planned"/>

  <path d="M275 815 H330" class="edge-current"/>
  <rect x="45" y="760" width="230" height="110" class="baseline"/>
  <text x="160" y="803" class="label">HZ01 基线</text><text x="160" y="841" class="small">V1 四专家 mixer</text>
  <rect x="330" y="775" width="170" height="80" class="baseline"/><text x="415" y="824" class="label">HZ01 归档</text>
  <rect x="705" y="760" width="240" height="110" class="current"/>
  <text x="825" y="803" class="label">当前账本</text><text x="825" y="841" class="small">bytes / oracle gap</text>
