<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrow-current" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#163A5F"/></marker>
    <marker id="arrow-planned" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#6B7280"/></marker>
    <style>
      .title { font: 700 44px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #163A5F; }
      .section { font: 700 23px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #6B7280; letter-spacing: 0; }
      .legend { font: 22px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #374151; }
      .label { font: 700 28px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .small { font: 22px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #374151; text-anchor: middle; }
      .current { fill: #FFFFFF; stroke: #163A5F; stroke-width: 4; }
      .focus { fill: #F1F5F9; stroke: #163A5F; stroke-width: 5; }
      .baseline { fill: #FFFFFF; stroke: #6B7280; stroke-width: 3.5; }
      .planned { fill: #FFFFFF; stroke: #6B7280; stroke-width: 3.5; stroke-dasharray: 12 8; }
      .edge-current { fill: none; stroke: #163A5F; stroke-width: 4; marker-end: url(#arrow-current); }
      .edge-planned { fill: none; stroke: #6B7280; stroke-width: 3.5; stroke-dasharray: 12 8; marker-end: url(#arrow-planned); }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <text x="80" y="82" class="title">HybridZip R2 完整目标架构</text>

  <rect x="1360" y="45" width="42" height="30" class="current"/>
  <path d="M1420 60 H1480" class="edge-current"/><text x="1500" y="68" class="legend">已有基础</text>
  <rect x="1650" y="45" width="42" height="30" class="planned"/>
  <path d="M1710 60 H1770" class="edge-planned"/><text x="1790" y="68" class="legend">未来扩展</text>

  <text x="80" y="183" class="section">目标组合能力（虚线）</text>
