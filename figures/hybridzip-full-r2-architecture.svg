  <path d="M1315 570 V640 H1115 V700" class="edge-current"/>
  <path d="M1295 757 H1355" class="edge-current"/>
  <path d="M1545 757 H1605" class="edge-current"/>
  <rect x="935" y="700" width="360" height="115" class="current"/>
