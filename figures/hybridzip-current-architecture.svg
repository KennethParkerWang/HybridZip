  <rect x="610" y="760" width="240" height="110" class="planned"/>
  <text x="730" y="803" class="label">Oracle 观测</text>
  <text x="730" y="841" class="small">边际贡献</text>
  <rect x="950" y="760" width="240" height="110" class="planned"/>
